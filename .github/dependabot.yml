version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/tools/desktop-app/"
    schedule:
      interval: "monthly"
      time: "05:35"
      timezone: "Asia/Taipei"
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        patterns:
          - "*"
