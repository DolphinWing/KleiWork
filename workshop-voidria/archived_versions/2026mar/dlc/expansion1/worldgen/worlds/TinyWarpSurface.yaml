name: Voidria.Voidria.WARP_NAME
description: Voidria.Voidria.WARP_DESC
disableWorldTraits: true
asteroidIcon: asteroid_unknown_kanim
nameTables: [ SWAMP, SULFUR ]

worldTraitScale: 1 # Adjust with worldSize. Traits are tuned to base game world sizes.
worldsize:
  X: 64
  Y: 80
layoutMethod: PowerTree

defaultsOverrides:
  data:
    OverworldAvoidRadius: 5
    OverworldSampleBehaviour: PoissonDisk
    OverworldDensityMin: 10
    OverworldDensityMax: 10
    DrawWorldBorder: true
    DrawWorldBorderForce: false
    WorldBorderThickness: 1
    WorldBorderRange: 0
#    OverworldMinNodes: 1
  startingWorldElements: [] # remove the algae check

worldTraitRules: [] # Disable world traits

seasons:
  - MiniRadioactiveOceanMeteorShowers
#  - NoDamagingMeteorShowers

fixedTraits:
  - sunlightVeryVeryLow
  - cosmicRadiationMed

startSubworldName: expansion1::subworlds/swamp/SwampStart
startingBaseTemplate: expansion1::bases/voa_warpworldBase
startingBasePositionHorizontal:
  min: 0.45
  max: 0.55
startingBasePositionVertical:
  min: 0.55
  max: 0.65

# List all the subworld files to load
subworldFiles:
  - name: subworlds/space/Space
  - name: subworlds/space/SpaceNoBorder
  - name: expansion1::subworlds/Voidria/voa_RustFrozen
  - name: expansion1::subworlds/swamp/SwampStart

unknownCellsAllowedSubworlds: 
  - tagcommand: Default
    command: Replace
    subworldNames:
      - subworlds/space/Space
  # Surface
  - tagcommand: DistanceFromTag
    tag: AtSurface
    minDistance: 0
    maxDistance: 0
    command: Replace
    subworldNames:
      - subworlds/space/SpaceNoBorder
  - tagcommand: DistanceFromTag
    tag: AtSurface
    minDistance: 1
    maxDistance: 1
    command: Replace
    subworldNames:
      - expansion1::subworlds/Voidria/voa_RustFrozen

worldTemplateRules:
  # Gravitas
  - names:
    - expansion1::poi/warp/sender_mini
    - expansion1::poi/warp/receiver_mini
    listRule: GuaranteeAll
    priority: 500
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtStart
        minDistance: 1
        maxDistance: 99
      - command: IntersectWith
        zoneTypes: [ Sandstone, Space, Swamp, OilField, Rust ]
      - command: ExceptWith # too close to core
        tagcommand: DistanceFromTag
        tag: AtDepths
        minDistance: 0
        maxDistance: 0
  # geodes
  - names:
    - expansion1::bases/Voa_Geode
    listRule: GuaranteeAll
    ruleId: tg_geode
    priority: 200
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtStart
        minDistance: 1
        maxDistance: 99
      - command: ExceptWith # too close to surface
        tagcommand: DistanceFromTag
        tag: AtSurface
        minDistance: 0
        maxDistance: 0
  # Critter Spaced Out!
  - names:
    - expansion1::critters/tg_beeta_hive
    - expansion1::critters/tg_divertgent
    - expansion1::critters/tg_plug_slug
    listRule: GuaranteeAll
    ruleId: tg_Critter_SpacedOut
    priority: 120
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtStart
        minDistance: 1
        maxDistance: 99
      - command: ExceptWith # too close to surface
        tagcommand: DistanceFromTag
        tag: AtSurface
        minDistance: 0
        maxDistance: 1