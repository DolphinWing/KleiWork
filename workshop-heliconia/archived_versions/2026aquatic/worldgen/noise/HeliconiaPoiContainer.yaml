settings:
  zoom: 1
  normalise: true
  lowerBound:
    X: 2
    Y: 2
  upperBound:
    X: 4
    Y: 4
  name: HeliconiaPoiContainer
links:
- target:
    type: Filter
    name: BaseFilter
  source0:
    type: Primitive
    name: BasePrimitive
- target:
    type: Terminator
    name: TERMINATOR
  source0:
    type: Transformer
    name: RotateHorizontal
- target:
    type: Transformer
    name: RotateHorizontal
  source0:
    type: Modifier
    name: ExtremeStretch
- target:
    type: Modifier
    name: ExtremeStretch
  source0:
    type: Filter
    name: BaseFilter
primitives:
  BasePrimitive:
    primative: SimplexPerlin
    quality: Best
    seed: 999
    offset: 1
    name: BasePrimitive
filters:
  BaseFilter:
    filter: RidgedMultiFractal
    frequency: 0.2 # 稍微增加頻率
    lacunarity: 2
    octaves: 2
    gain: 0.5
    offset: 0
    exponent: 0.9
    name: BaseFilter
modifiers:
  ExtremeStretch:
    modifyType: Scale2d
    scale: 1
    scale2d:
      X: 10.0 # 拉伸從 20 降到 5
      Y: 0.2 # 壓縮從 0.1 升到 0.5
    name: ExtremeStretch
transformers:
  RotateHorizontal:
    transformerType: RotatePoint
    power: 1
    vector:
      Y: 90
    name: RotateHorizontal
