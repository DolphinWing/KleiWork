name: Heliconia.Heliconia.WARP_NAME
description: Heliconia.Heliconia.WARP_DESCRIPTION
nameTables: [ SWAMP, RADIOACTIVE ]
asteroidIcon: asteroid_vanilla_sandstone_warp_kanim

worldTraitScale: 0.3
worldsize:
  X: 160
  Y: 176
layoutMethod: PowerTree

defaultsOverrides:
  data:
    DrawWorldBorderForce: false
    DrawWorldBorder: true
    WorldBorderThickness: 3
    WorldBorderRange: 1
    OverworldDensityMin: 18
    OverworldDensityMax: 18
    OverworldAvoidRadius: 5
    OverworldSampleBehaviour: PoissonDisk
    POIPadding: 1

worldTraitRules:
  - min: 2
    max: 2
    forbiddenTags:
      - StartWorldOnly
      - Oil
      - LargeWorld
      - Surface
      - Core
      - GenericGeysers

subworldMixingRules:
 - name: (Mixing4)
   minCount: 1
   maxCount: 3
 - name: (Mixing6)
   minCount: 1
   maxCount: 3

fixedTraits:
  - sunlightMedLow
  - cosmicRadiationVeryLow

seasons:
  - ClassicStyleWarpMeteorShowers
  - MediumRadioactiveVanillaWarpPlanetMeteorShowers

startSubworldName: expansion1::subworlds/Heliconia/SwampWarpStart
startingBaseTemplate:  expansion1::bases/HeliconiaWarpBase
startingBasePositionHorizontal:
  min: 0.475
  max: 0.525
startingBasePositionVertical:
  min: 0.4
  max: 0.45

# List all the subworld files to load
subworldFiles:
  - name: subworlds/space/Space
  - name: expansion1::subworlds/Heliconia/SpaceWithHotBorder    
  - name: expansion1::subworlds/Heliconia/SwampMedium
  - name: expansion1::subworlds/Heliconia/SwampWarpStart
  - name: expansion1::subworlds/Heliconia/RustMedium
    minCount: 4
  - name: expansion1::subworlds/Heliconia/RadioactiveMedium
    minCount: 3
  - name: expansion1::subworlds/Heliconia/RadioactiveFieldsMedium
    minCount: 1
  - name: expansion1::subworlds/Heliconia/RadioactiveCore
    minCount: 2
  - name: expansion1::subworlds/Heliconia/med_FrozenMedium
    minCount: 3
  - name: expansion1::subworlds/Heliconia/FrozenCore
  - name: expansion1::subworlds/Heliconia/ForestMediumHot
    minCount: 3
    maxCount: 5
  - name: expansion1::subworlds/Heliconia/ForestMedium
    minCount: 2
    maxCount: 3
  - name: expansion1::subworlds/Heliconia/MarshMediumHot
    minCount: 3
    
unknownCellsAllowedSubworlds: 
  - tagcommand: Default
    command: Replace
    subworldNames:
     - expansion1::subworlds/Heliconia/SwampMedium
  - tagcommand: DistanceFromTag
    tag: AtStart
    minDistance: 1
    maxDistance: 1
    command: Replace
    subworldNames:
      - expansion1::subworlds/Heliconia/SwampMedium
  - tagcommand: DistanceFromTag
    tag: AtStart
    minDistance: 2
    maxDistance: 2
    command: Replace
    subworldNames:
      - expansion1::subworlds/Heliconia/ForestMediumHot
      - expansion1::subworlds/Heliconia/SwampMedium
      - expansion1::subworlds/Heliconia/RustMedium
      - (Mixing4)
      - (Mixing6)
  - tagcommand: DistanceFromTag
    tag: AtStart
    minDistance: 3
    maxDistance: 3
    command: Replace
    subworldNames:
      - expansion1::subworlds/Heliconia/ForestMedium
      - expansion1::subworlds/Heliconia/RustMedium
      - (Mixing4)
      - (Mixing6)
  - tagcommand: DistanceFromTag
    tag: AtStart
    minDistance: 4
    maxDistance: 99
    command: Replace
    subworldNames:
      - expansion1::subworlds/Heliconia/MarshMediumHot
      - expansion1::subworlds/Heliconia/RustMedium
  - tagcommand: AtTag
    tag: AtSurface
    command: Replace
    subworldNames:
      - subworlds/space/Space
  - tagcommand: DistanceFromTag # Space with crust
    tag: AtSurface
    minDistance: 1
    maxDistance: 1
    command: Replace
    subworldNames:
      - expansion1::subworlds/Heliconia/SpaceWithHotBorder
  - tagcommand: DistanceFromTag # Swamp surrounds Start
    tag: AtSurface
    minDistance: 2
    maxDistance: 2
    command: Replace
    subworldNames:
      - expansion1::subworlds/Heliconia/MarshMediumHot
      - expansion1::subworlds/Heliconia/med_FrozenMedium
      - (Mixing4)
      - (Mixing6)
  - tagcommand: DistanceFromTag # Above Core
    tag: AtDepths
    minDistance: 1
    maxDistance: 1
    command: Replace
    subworldNames:
      - expansion1::subworlds/Heliconia/RadioactiveMedium
      - expansion1::subworlds/Heliconia/RadioactiveFieldsMedium
  - tagcommand: DistanceFromTag # Core
    tag: AtDepths
    minDistance: 0
    maxDistance: 0
    command: Replace
    subworldNames:
      - expansion1::subworlds/Heliconia/RadioactiveCore
      - expansion1::subworlds/Heliconia/FrozenCore
      - (Mixing4)
      - (Mixing6)

worldTemplateRules:
  # Frozen Uranium
  - names:
      - expansion1::poi/radioactive/uranium_fields_liquid_co2_geyser
      - expansion1::poi/radioactive/uranium_fields_liquid_co2_geyser_b
      - expansion1::poi/radioactive/uranium_fields_liquid_co2_geyser_c
    listRule: GuaranteeSomeTryMore
    someCount: 1
    moreCount: 1
    priority: 100
    allowExtremeTemperatureOverlap: true # This is acceptable
    allowedCellsFilter:
      - command: Replace
        zoneTypes: [Radioactive]
      - command: IntersectWith
        subworldNames:
          - expansion1::subworlds/Heliconia/RadioactiveMedium
          - expansion1::subworlds/Heliconia/RadioactiveFieldsMedium
  - names:
      - poi/frozen/heatsink_a
      - poi/frozen/heatsink_b
    listRule: GuaranteeOne
    priority: 100 
    allowedCellsFilter:
      - command: Replace
        zoneTypes: [FrozenWastes]
  # Marsh
  - names:
      - poi/hotmarsh/geyser_steam
    listRule: TryOne
    priority: 100
    allowedCellsFilter:
      - command: Replace
        zoneTypes: [BoggyMarsh]
  # Gravitas
  - names:
    - expansion1::poi/warp/sender
    - expansion1::poi/warp/receiver
    listRule: GuaranteeAll
    priority: 90
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtStart
        minDistance: 1
        maxDistance: 3
      - command: IntersectWith
        zoneTypes: [ Swamp, Rust, Forest ]
      - command: ExceptWith
        tagcommand: AtTag
        tag: NoGravitasFeatures
  # Boons
  - names:
    - expansion1::poi/boon/bedroom
    - expansion1::poi/boon/washroom
    - expansion1::poi/boon/power
    - expansion1::poi/boon/kitchen
    listRule: TrySome
    someCount: 2
    priority: 50
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtSurface
        minDistance: 2
        maxDistance: 2
      - command: IntersectWith
        zoneTypes: [ Swamp, Rust, Forest ]
  - names:
    - expansion1::poi/boon/bedroom
    - expansion1::poi/boon/washroom
    - expansion1::poi/boon/power
    - expansion1::poi/boon/kitchen
    - expansion1::poi/boon/well
    - expansion1::poi/boon/farm
    listRule: TrySome
    someCount: 2
    priority: 50
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtStart
        minDistance: 1
        maxDistance: 3
      - command: IntersectWith
        zoneTypes: [ Swamp, Rust, Forest ]
  # Curated geysers
  - names:
    - expansion1::geysers/molten_aluminum
    - expansion1::geysers/molten_cobalt
    - geysers/molten_copper
    - geysers/molten_gold
    - geysers/molten_iron
    - geysers/hot_water
    listRule: TryOne
    times: 3
    allowDuplicates: true
    priority: 50
    allowedCellsFilter:
    - command: Replace
      tagcommand: DistanceFromTag
      tag: AtStart
      minDistance: 1
      maxDistance: 99
    - command: ExceptWith
      tagcommand: DistanceFromTag
      tag: AtSurface
      minDistance: 0
      maxDistance: 2
  - names:
    - geysers/steam
    - geysers/hot_steam
    listRule: TryOne
    times: 1
    allowDuplicates: true
    priority: 50
    allowedCellsFilter:
    - command: Replace
      tagcommand: DistanceFromTag
      tag: AtStart
      minDistance: 1
      maxDistance: 99
    - command: ExceptWith
      tagcommand: DistanceFromTag
      tag: AtSurface
      minDistance: 0
      maxDistance: 2
  - names:
    - geysers/slimy_po2
    - geysers/methane
    - geysers/chlorine_gas
    - geysers/hot_co2
    - geysers/hot_hydrogen
    - geysers/hot_po2
    - expansion1::geysers/liquid_sulfur
    - geysers/small_volcano
    listRule: TryOne
    times: 2
    allowDuplicates: true
    priority: 50
    allowedCellsFilter:
    - command: Replace
      tagcommand: DistanceFromTag
      tag: AtStart
      minDistance: 1
      maxDistance: 99
    - command: ExceptWith
      tagcommand: DistanceFromTag
      tag: AtSurface
      minDistance: 0
      maxDistance: 2
  # Critter Spaced Out!
  - names:
    - expansion1::critters/tg_beeta_hive
    - expansion1::critters/tg_divertgent
    - expansion1::critters/tg_plug_slug
    listRule: TryAll
    ruleId: hca_critters_spacedout
    priority: 120
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtStart
        minDistance: 1
        maxDistance: 99
      - command: ExceptWith # too close to surface
        tagcommand: DistanceFromTag
        tag: AtSurface
        minDistance: 0
        maxDistance: 1
  - names:
    - events/strangeasteroid/frozen_vacillator
    listRule: TryOne
    priority: 150
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtDepths
        minDistance: 0
        maxDistance: 1
  - names:
    - expansion1::poi/radioactive/uranium_centrifuge
    listRule: GuaranteeOne
    priority: 200
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtDepths
        minDistance: 0
        maxDistance: 0
