name: Heliconia.Heliconia.NAME
description: Heliconia.Heliconia.DESCRIPTION
nameTables: [ MAGMA ]
asteroidIcon: asteroid_heliconia_kanim

worldTraitScale: 0.9
worldsize:
  X: 240
  Y: 380
layoutMethod: PowerTree

defaultsOverrides:
  startingWorldElements: []

startSubworldName: subworlds/Heliconia/ForestStart
startingBaseTemplate: bases/HcaForestBase
startingBasePositionHorizontal:
  min: 0.5
  max: 0.5
startingBasePositionVertical:
  min: 0.35
  max: 0.40

worldTraitRules:
  - min: 0
    max: 3
    forbiddenTags:
      - Surface # due to classic worlds having a different surface location
      - NonStartWorld
    forbiddenTraits:
      - traits/MisalignedStart
      - traits/DeepOil
      - traits/IrregularOil
      - traits/MagmaVents
      - traits/SubsurfaceOcean
      - traits/GeoDormant
      - traits/FrozenCore
      - traits/GlaciersLarge

# List all the subworld files to load
subworldFiles:
  - name: subworlds/Heliconia/ForestStart
  - name: subworlds/Heliconia/Marsh
  - name: subworlds/Heliconia/Barren
  - name: subworlds/Heliconia/Desert
  - name: subworlds/Heliconia/Forest
  - name: subworlds/Heliconia/Frozen
  - name: subworlds/Heliconia/FrozenSolid
  - name: subworlds/Heliconia/Jungle
  - name: subworlds/Heliconia/ShelterZone
    minCount: 1
    maxCount: 1
  - name: subworlds/Heliconia/Ocean
    #minCount: 1
  - name: subworlds/Heliconia/Oil
  - name: subworlds/Heliconia/Rust
    #minCount: 1
  - name: subworlds/Heliconia/Sandstone
  - name: subworlds/Heliconia/ForestMiniMetal
    #minCount: 1
  - name: subworlds/Heliconia/ForestMiniWater
    #minCount: 1
  - name: subworlds/Heliconia/ForestMiniOxy
    #minCount: 1
  - name: subworlds/space/Space
  - name: subworlds/space/SpaceNoBorder
  - name: subworlds/Heliconia/IronSurface
  - name: subworlds/Heliconia/IronCore
  - name: subworlds/Heliconia/CopperCore
  - name: subworlds/Heliconia/GoldCore
  - name: subworlds/Heliconia/MoltenGlassCore
    minCount: 3

fixedTraits:
  - largeImpactorFragmentsAllowed

seasons:
  - LargeImpactor
  - ClassicStyleStartMeteorShowers

# Specify where subworlds can spawn. These rules are processed in order and their effects are cumulative.
unknownCellsAllowedSubworlds: 
  - tagcommand: Default
    command: Replace
    subworldNames:
      - subworlds/Heliconia/ForestStart

  # Ring-1
  - tagcommand: DistanceFromTag
    tag: AtStart
    minDistance: 1
    maxDistance: 1
    command: Replace
    subworldNames:
      - subworlds/Heliconia/ForestMiniMetal
      - subworlds/Heliconia/ForestMiniWater
      - subworlds/Heliconia/ForestMiniOxy
      - subworlds/Heliconia/ShelterZone

  # Ring-2
  - tagcommand: DistanceFromTag
    tag: AtStart
    minDistance: 2
    maxDistance: 2
    command: Replace
    subworldNames:
      - subworlds/Heliconia/Forest
      - subworlds/Heliconia/Marsh
      - subworlds/Heliconia/Jungle
      - subworlds/Heliconia/Frozen
      - subworlds/Heliconia/Rust

  # Ring-3
  - tagcommand: DistanceFromTag
    tag: AtStart
    minDistance: 3
    maxDistance: 3
    command: Replace
    subworldNames:
      - subworlds/Heliconia/Forest
      - subworlds/Heliconia/Marsh
      - subworlds/Heliconia/Jungle
      - subworlds/Heliconia/Ocean
      - subworlds/Heliconia/Sandstone

  # Ring-4
  - tagcommand: DistanceFromTag
    tag: AtStart
    minDistance: 4
    maxDistance: 4
    command: Replace
    subworldNames:
      - subworlds/Heliconia/Desert
      - subworlds/Heliconia/Barren
      - subworlds/Heliconia/Ocean
      - subworlds/Heliconia/Frozen
      - subworlds/Heliconia/Rust

  # Ring-5
  - tagcommand: DistanceFromTag
    tag: AtStart
    minDistance: 5
    maxDistance: 999
    command: Replace
    subworldNames:
      - subworlds/Heliconia/Forest
      - subworlds/Heliconia/Marsh
      - subworlds/Heliconia/Desert
      - subworlds/Heliconia/Ocean
      - subworlds/Heliconia/Barren
      - subworlds/Heliconia/Ocean
      - subworlds/Heliconia/Jungle
      - subworlds/Heliconia/Sandstone
      - subworlds/Heliconia/Frozen
      - subworlds/Heliconia/FrozenSolid
      - subworlds/Heliconia/Rust

  # Core
  - tagcommand: AtTag
    tag: AtDepths
    command: Replace
    subworldNames:
      - subworlds/Heliconia/IronCore
      - subworlds/Heliconia/CopperCore
      - subworlds/Heliconia/GoldCore
      - subworlds/Heliconia/MoltenGlassCore

  # Above Core
  - tagcommand: DistanceFromTag
    tag: AtDepths
    minDistance: 1
    maxDistance: 1
    command: Replace
    subworldNames:
      - subworlds/Heliconia/Oil
      - subworlds/Heliconia/MoltenGlassCore

  # Space
  - tagcommand: AtTag
    tag: AtSurface
    command: Replace
    subworldNames:
      - subworlds/space/Space
  - tagcommand: DistanceFromTag
    tag: AtSurface
    minDistance: 1
    maxDistance: 1
    command: Replace
    subworldNames:
      - subworlds/space/SpaceNoBorder
  - tagcommand: DistanceFromTag
    tag: AtSurface
    minDistance: 2
    maxDistance: 2
    command: Replace
    subworldNames:
      - subworlds/Heliconia/IronSurface

worldTemplateRules:
  # Jungle
  - names:
      - poi/jungle/geyser_steam
    listRule: TryOne
    priority: 100
    allowedCellsFilter:
      - command: Replace
        zoneTypes: [ MagmaCore, OilField, ToxicJungle, Ocean ]

  # Marsh
  - names:
      - poi/hotmarsh/geyser_steam
    listRule: TryOne
    priority: 100
    allowedCellsFilter:
      - command: Replace
        zoneTypes: [ MagmaCore, OilField, BoggyMarsh, Rust ]

  # Oil
  - names:
    - poi/oil/small_oilpockets_geyser_a
    - poi/oil/small_oilpockets_geyser_b
    - poi/oil/small_oilpockets_geyser_c
    - poi/oil/small_oilpockets_geyser_d
    - poi/oil/small_oilpockets_geyser_e
    - poi/oil/small_oilpockets_geyser_f
    - poi/oil/small_oilpockets_geyser_g
    - poi/oil/small_oilpockets_geyser_h
    listRule: TryOne
    times: 5
    allowDuplicates: true # be more flexible due to high temperature borders
    priority: 100
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtDepths
        minDistance: 1
        maxDistance: 3

  # Gravitas
  - names:
    - poi/poi_gravitas
    listRule: GuaranteeOne
    priority: 500
    allowExtremeTemperatureOverlap: true # ignore temperature differences on the surface
    allowedCellsFilter:
      - command: Replace
        subworldNames:
          - subworlds/space/SpaceNoBorder

  # Generic Geysers
  - names:
    - geysers/hot_steam
    - geysers/hot_co2
    - geysers/hot_hydrogen
    - geysers/hot_po2
    - geysers/big_volcano
    - geysers/small_volcano
    - geysers/molten_iron
    - geysers/molten_copper
    - geysers/molten_gold
    - geysers/oil_drip
    - expansion1::geysers/molten_aluminum
    - expansion1::geysers/molten_cobalt
    listRule: TryOne
    times: 8
    ruleId: GenericGeysers
    allowDuplicates: true
    allowedCellsFilter:
      - command: Replace
        tagcommand: NotAtTag
        tag: NoGlobalFeatureSpawning

  # Leaky Oil Fissure (Guaranteed)
  - names:
    - geysers/oil_drip
    listRule: GuaranteeOne
    priority: 100
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtStart
        minDistance: 2
        maxDistance: 5
      - command: ExceptWith
        tagcommand: NotAtTag
        tag: NoGlobalFeatureSpawning

  # Shelter
  - names:
      - bases/HcaShelter
    listRule: GuaranteeOne
    ruleId: hca_shelter
    priority: 500
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtStart
        minDistance: 0
        maxDistance: 1
      - command: ExceptWith
        tagcommand: DistanceFromTag
        tag: AtSurface
        minDistance: 0
        maxDistance: 5

  # Critter Caves
  - names:
    - critters/tg_bean_sleat
    - critters/tg_bug_morb_toilet
    - critters/tg_ce_lily_cave
    - critters/tg_hatch_lice
    - critters/tg_pacu_lake
    - critters/tg_pip_tree
    - critters/tg_pokeshell_pepper
    - critters/tg_puft_love
    - critters/tg_slime_sour
    - critters/tg_mole_hole
    - critters/tg_wheat_wort
    listRule: TryAll
    ruleId: hca_critters_base
    priority: 80
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtStart
        minDistance: 3
        maxDistance: 99
      - command: ExceptWith
        tagcommand: AtTag
        tag: NoGravitasFeatures
      - command: ExceptWith
        tagcommand: DistanceFromTag
        tag: AtDepths
        minDistance: 0
        maxDistance: 2
      - command: ExceptWith
        tagcommand: DistanceFromTag
        tag: AtSurface
        minDistance: 0
        maxDistance: 2

modifyLayoutTags:
  - addTags:
      - NoGlobalFeatureSpawning
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtSurface
        minDistance: 0
        maxDistance: 5
      - command: ExceptWith
        tagcommand: DistanceFromTag
        tag: AtEdge
        minDistance: 0
        maxDistance: 1