name: Heliconia.Heliconia.NAME
description: Heliconia.Heliconia.DESCRIPTION
nameTables: [ MAGMA ]
asteroidIcon: asteroid_heliconia_kanim

worldTraitScale: 0.9
worldsize:
  X: 240
  Y: 380
layoutMethod: PowerTree

defaultsOverrides:
  startingWorldElements: []

startSubworldName: subworlds/Heliconia/ForestStart
startingBaseTemplate: bases/forestBase
startingBasePositionHorizontal:
  min: 0.5
  max: 0.5
startingBasePositionVertical:
  min: 0.3
  max: 0.4

worldTraitRules:
  - min: 0
    max: 3
    forbiddenTags:
      - Surface # due to classic worlds having a different surface location
      - NonStartWorld
    forbiddenTraits:
      - traits/MisalignedStart
      - traits/DeepOil
      - traits/IrregularOil
      - traits/MagmaVents
      - traits/SubsurfaceOcean
      - traits/GeoDormant
      - traits/FrozenCore
      - traits/GlaciersLarge
      - expansion1::traits/IrregularOil
      - expansion1::traits/LushCore
      - expansion1::traits/SubsurfaceOcean

# List all the subworld files to load
subworldFiles:
  - name: subworlds/Heliconia/ForestStart
  - name: subworlds/Heliconia/Marsh
  - name: subworlds/Heliconia/Barren
  - name: subworlds/Heliconia/Desert
  - name: subworlds/Heliconia/Forest
  - name: subworlds/Heliconia/Frozen
  - name: subworlds/Heliconia/FrozenSolid
  - name: subworlds/Heliconia/Jungle
  - name: expansion1::subworlds/Heliconia/ShelterZone
    minCount: 1
    maxCount: 1
  - name: subworlds/Heliconia/Ocean
    minCount: 1
  - name: subworlds/Heliconia/Oil
  - name: subworlds/Heliconia/Rust
    minCount: 1
  - name: subworlds/Heliconia/Sandstone
  - name: subworlds/Heliconia/ForestMiniMetal
    minCount: 1
  - name: subworlds/Heliconia/ForestMiniWater
    minCount: 1
  - name: subworlds/Heliconia/ForestMiniOxy
    minCount: 1
  - name: subworlds/space/SpaceNoBorder
  - name: expansion1::subworlds/Heliconia/FrozenMedium
  - name: expansion1::subworlds/Heliconia/Rust
  - name: expansion1::subworlds/Heliconia/JungleHot
  - name: expansion1::subworlds/Heliconia/Radioactive
    minCount: 1
    weight: 0.5
  - name: expansion1::subworlds/Heliconia/Swamp
  - name: expansion1::subworlds/Heliconia/Wasteland
  - name: subworlds/Heliconia/IronSurface
  - name: subworlds/Heliconia/IronCore
  - name: subworlds/Heliconia/CopperCore
  - name: subworlds/Heliconia/GoldCore
  - name: expansion1::subworlds/Heliconia/CobaltCore
  - name: expansion1::subworlds/Heliconia/AluminumCore
  - name: expansion1::subworlds/Heliconia/RadioactiveCore

fixedTraits:
  - sunlightVeryVeryLow
  - cosmicRadiationVeryLow

seasons:
  - ClassicStyleStartMeteorShowers

# Specify where subworlds can spawn. These rules are processed in order and their effects are cumulative.
unknownCellsAllowedSubworlds: 
  - tagcommand: Default
    command: Replace
    subworldNames:
      - subworlds/Heliconia/ForestStart

  - tagcommand: DistanceFromTag
    tag: AtStart
    minDistance: 1
    maxDistance: 1
    command: Replace
    subworldNames:
      - subworlds/Heliconia/ForestMiniMetal
      - subworlds/Heliconia/ForestMiniWater
      - subworlds/Heliconia/ForestMiniOxy
      - expansion1::subworlds/Heliconia/ShelterZone

  # Ring-1
  - tagcommand: DistanceFromTag
    tag: AtStart
    minDistance: 2
    maxDistance: 2
    command: Replace
    subworldNames:
      - subworlds/Heliconia/Forest
      - subworlds/Heliconia/Marsh
      - subworlds/Heliconia/Jungle
      - subworlds/Heliconia/Frozen
      - subworlds/Heliconia/Rust
      - expansion1::subworlds/Heliconia/JungleHot

  # Ring-2
  - tagcommand: DistanceFromTag
    tag: AtStart
    minDistance: 3
    maxDistance: 3
    command: Replace
    subworldNames:
      - subworlds/Heliconia/Forest
      - subworlds/Heliconia/Marsh
      - subworlds/Heliconia/Jungle
      - subworlds/Heliconia/Ocean
      - subworlds/Heliconia/Sandstone
      - expansion1::subworlds/Heliconia/JungleHot
      - expansion1::subworlds/Heliconia/Swamp
      - expansion1::subworlds/Heliconia/Wasteland

  # Ring-3
  - tagcommand: DistanceFromTag
    tag: AtStart
    minDistance: 4
    maxDistance: 4
    command: Replace
    subworldNames:
      - subworlds/Heliconia/Desert
      - subworlds/Heliconia/Barren
      - subworlds/Heliconia/Ocean
      - subworlds/Heliconia/Frozen
      - subworlds/Heliconia/Rust
      - expansion1::subworlds/Heliconia/FrozenMedium
      - expansion1::subworlds/Heliconia/Rust
      - expansion1::subworlds/Heliconia/Radioactive
      - expansion1::subworlds/Heliconia/Swamp
      - expansion1::subworlds/Heliconia/Wasteland

  # Ring-4
  - tagcommand: DistanceFromTag
    tag: AtStart
    minDistance: 5
    maxDistance: 999
    command: Replace
    subworldNames:
      - subworlds/Heliconia/Forest
      - subworlds/Heliconia/Marsh
      - subworlds/Heliconia/Desert
      - subworlds/Heliconia/Ocean
      - subworlds/Heliconia/Barren
      - subworlds/Heliconia/Ocean
      - subworlds/Heliconia/Jungle
      - subworlds/Heliconia/Sandstone
      - subworlds/Heliconia/Frozen
      - subworlds/Heliconia/FrozenSolid
      - subworlds/Heliconia/Rust
      - expansion1::subworlds/Heliconia/JungleHot
      - expansion1::subworlds/Heliconia/Rust
      - expansion1::subworlds/Heliconia/Radioactive
      - expansion1::subworlds/Heliconia/Swamp
      - expansion1::subworlds/Heliconia/Wasteland

  # Core
  - tagcommand: AtTag
    tag: AtDepths
    command: Replace
    subworldNames:
      - subworlds/Heliconia/IronCore
      - subworlds/Heliconia/CopperCore
      - subworlds/Heliconia/GoldCore
      - expansion1::subworlds/Heliconia/CobaltCore
      - expansion1::subworlds/Heliconia/AluminumCore

  # Above Core
  - tagcommand: DistanceFromTag
    tag: AtDepths
    minDistance: 1
    maxDistance: 1
    command: Replace
    subworldNames:
      - subworlds/Heliconia/Oil
      - expansion1::subworlds/Heliconia/RadioactiveCore

  # Space
  - tagcommand: AtTag
    tag: AtSurface
    command: Replace
    subworldNames:
      - subworlds/space/SpaceNoBorder
  - tagcommand: DistanceFromTag
    tag: AtSurface
    minDistance: 1
    maxDistance: 1
    command: Replace
    subworldNames:
      - subworlds/space/SpaceNoBorder

  # Surface
  - tagcommand: DistanceFromTag
    tag: AtSurface
    minDistance: 2
    maxDistance: 2
    command: Replace
    subworldNames:
      - subworlds/Heliconia/IronSurface

worldTemplateRules:
  # Jungle
  - names:
      - poi/jungle/geyser_steam
    listRule: TryOne
    priority: 100
    allowedCellsFilter:
      - command: Replace
        zoneTypes: [ MagmaCore, OilField, ToxicJungle ]

  # Marsh
  - names:
      - poi/hotmarsh/geyser_steam
    listRule: TryOne
    priority: 100
    allowedCellsFilter:
      - command: Replace
        zoneTypes: [ MagmaCore, OilField, BoggyMarsh ]

  # Oil
  - names:
    - poi/oil/small_oilpockets_geyser_a
    - poi/oil/small_oilpockets_geyser_b
    - poi/oil/small_oilpockets_geyser_c
    - poi/oil/small_oilpockets_geyser_d
    - poi/oil/small_oilpockets_geyser_e
    - poi/oil/small_oilpockets_geyser_f
    - poi/oil/small_oilpockets_geyser_g
    - poi/oil/small_oilpockets_geyser_h
    listRule: TryOne
    times: 5
    allowDuplicates: true # be more flexible due to high temperature borders
    priority: 100
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtDepths
        minDistance: 1
        maxDistance: 3
#        zoneTypes: [ MagmaCore, OilField ]

  # Gravitas
  - names:
    - expansion1::poi/warp/sender
    - expansion1::poi/warp/receiver
    - expansion1::poi/warp/teleporter
    listRule: GuaranteeAll
    priority: 90
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtStart
        minDistance: 2
        maxDistance: 5
      - command: ExceptWith
        tagcommand: DistanceFromTag
        tag: AtSurface
        minDistance: 0
        maxDistance: 2
      - command: ExceptWith
        zoneTypes: [ Space, MagmaCore ]
      - command: ExceptWith
        tagcommand: AtTag
        tag: NoGravitasFeatures
  - names:
    - expansion1::poi/genericGravitas/poi_office
    listRule: TryOne
    priority: 90
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtStart
        minDistance: 2
        maxDistance: 99
      - command: ExceptWith
        tagcommand: AtTag
        tag: NoGravitasFeatures
      - command: ExceptWith
        tagcommand: DistanceFromTag
        tag: AtDepths
        minDistance: 0
        maxDistance: 2
      - command: ExceptWith
        tagcommand: DistanceFromTag
        tag: AtSurface
        minDistance: 0
        maxDistance: 2

  # Generic Geysers
  - names:
    - geysers/hot_steam
    - geysers/hot_co2
    - geysers/hot_hydrogen
    - geysers/hot_po2
    - geysers/big_volcano
    - geysers/small_volcano
    - geysers/molten_iron
    - geysers/molten_copper
    - geysers/molten_gold
    - geysers/oil_drip
    - expansion1::geysers/molten_aluminum
    - expansion1::geysers/molten_cobalt
    listRule: TryOne
    times: 8
    ruleId: GenericGeysers
    allowDuplicates: true
    allowedCellsFilter:
      - command: Replace
        tagcommand: NotAtTag
        tag: NoGlobalFeatureSpawning

  # Leaky Oil Fissure (Guaranteed)
  - names:
    - geysers/oil_drip
    listRule: GuaranteeOne
    priority: 100
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtStart
        minDistance: 2
        maxDistance: 5
      - command: ExceptWith
        tagcommand: NotAtTag
        tag: NoGlobalFeatureSpawning

  # Critter Caves
  - names:
    - critters/tg_bean_sleat
    - critters/tg_bug_morb_toilet
    - critters/tg_ce_lily_cave
    - critters/tg_hatch_lice
    - critters/tg_pacu_lake
    - critters/tg_pip_tree
    - critters/tg_pokeshell_pepper
    - critters/tg_puft_love
    - critters/tg_slime_sour
    - critters/tg_mole_hole
    - critters/tg_wheat_wort
    - expansion1::critters/tg_beeta_hive
    listRule: TryAll
    ruleId: hca_critters_base
    priority: 80
    allowedCellsFilter:
      - command: Replace
        tagcommand: DistanceFromTag
        tag: AtStart
        minDistance: 3
        maxDistance: 99
      - command: ExceptWith
        tagcommand: AtTag
        tag: NoGravitasFeatures
      - command: ExceptWith
        tagcommand: DistanceFromTag
        tag: AtDepths
        minDistance: 0
        maxDistance: 3
      - command: ExceptWith
        tagcommand: DistanceFromTag
        tag: AtSurface
        minDistance: 0
        maxDistance: 3

